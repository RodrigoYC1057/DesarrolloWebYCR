<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 </title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; color: #333; }
        h2 { color: #1e40af; font-size: 20px; }

        
        #panel {
            background-color: #FFEAA7;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 100px;
            border: 1px solid #ccc;
        }
        #panel p { margin: 4px 0; font-size: 14px; }
        #btnColor {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 8px 18px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 8px;
        }
        #btnColor:hover { background-color: #1e40af; }

        /* SECCIÓN PÁRRAFOS */
        #seccion-parrafos {
            margin-bottom: 20px;
            border: 1px solid #ccc;
            padding: 15px;
        }
        #seccion-parrafos label { font-size: 14px; display: block; margin-bottom: 6px; }
        #txtInput {
            width: 60%;
            padding: 7px;
            border: 1px solid #aaa;
            font-size: 13px;
        }
        #btnAgregar {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 7px 18px;
            cursor: pointer;
            font-size: 13px;
            margin-left: 6px;
        }
        #btnEliminar {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 7px 18px;
            cursor: pointer;
            font-size: 13px;
            margin-left: 6px;
        }
        #lista { margin-top: 10px; }
        .item-dinamico {
            font-size: 13px;
            margin: 4px 0;
            padding: 2px 0;
            border-bottom: 1px dashed #ccc;
        }

        /* IMAGEN CON MOUSEOVER */
        #seccion-imagen {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }
        #miImagen {
            width: 180px;
            height: 130px;
            object-fit: cover;
            border: 3px solid transparent;
            cursor: pointer;
            background-color: #ddd;
        }
    </style>
</head>
<body>

    <h2>Ejercicio2-DOM y Eventos</h2>

    <div id="panel">
        <p><strong>Panel de Control</strong></p>
        <p id="colorActual">Color actual: Amarillo</p>
        <p id="cont">Clics: 0</p>
        <button id="btnColor" onclick="cambiarColor()">Cambiar Color</button>
    </div>

    
    <div id="seccion-parrafos">
        <label>Agregar párrafos dinámicos:</label>
        <input type="text" id="txtInput" placeholder="Texto de ejemplo ingresado por el usuario...">
        <button id="btnAgregar">Agregar</button>
        <button id="btnEliminar">Eliminar</button>
        <div id="lista"></div>
    </div>

    
    <div id="seccion-imagen">
        
        <img id="miImagen"
             src="images/image1.jfif"
             alt="Imagen con hover">
    </div>

    <script src="dom_eventos.js"></script>
</body>
</html>
