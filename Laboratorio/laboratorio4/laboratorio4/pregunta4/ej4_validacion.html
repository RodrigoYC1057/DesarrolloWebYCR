<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 4</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .campo-contenedor { margin-bottom: 15px; width: 300px; }
        label { display: block; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 2px solid #ccc; border-radius: 4px; outline: none; }
        .error-msg { color: #DC2626; font-size: 0.85em; display: none; margin-top: 4px; }
        button { background-color: #1e40af; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #1e3a8a; }
    </style>
</head>
<body>

    <h2>Ejercicio 4: Validación de Formulario de Registro</h2>

    <form id="miForm">
        <div class="campo-contenedor">
            <label>Nombre completo:</label>
            <input type="text" id="nombre" placeholder="Ej. Ana Lopez">
            <span id="err_nombre" class="error-msg"></span>
        </div>

        <div class="campo-contenedor">
            <label>Correo electrónico:</label>
            <input type="text" id="email" placeholder="usuario@dominio.com">
            <span id="err_email" class="error-msg"></span>
        </div>

        <div class="campo-contenedor">
            <label>Contraseña:</label>
            <input type="password" id="pass" placeholder="8-10 caracteres">
            <span id="err_pass" class="error-msg"></span>
        </div>

        <div class="campo-contenedor">
            <label>Teléfono (Bolivia):</label>
            <input type="text" id="telefono" placeholder="6XXXXXXX o 7XXXXXXX">
            <span id="err_telefono" class="error-msg"></span>
        </div>

        <div class="campo-contenedor">
            <label>Fecha de nacimiento:</label>
            <input type="text" id="fecha" placeholder="DD/MM/AAAA">
            <span id="err_fecha" class="error-msg"></span>
        </div>

        <button type="submit">Registrarse</button>
    </form>

    <script src="validar.js"></script>
</body>
</html>
