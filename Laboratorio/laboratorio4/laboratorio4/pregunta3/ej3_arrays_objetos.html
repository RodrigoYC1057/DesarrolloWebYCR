<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3 - Gestión de Estudiantes</title>
    <style>
    
        body { font-family: sans-serif; padding: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        th { background-color: #1e293b; color: white; padding: 10px; text-align: left; }
        td { border: 1px solid #e2e8f0; padding: 10px; }
        #resumen { font-weight: bold; margin-top: 15px; }
        .aprobado-texto { color: #16a34a; }
        .reprobado-texto { color: #dc2626; }
        #nombres { color: #1e40af; margin-top: 5px; }
    </style>

    <script>
    
        function Estudiante(nombre, n1, n2, n3) { 
            this.nombre = nombre; 
            this.nota1  = n1; 
            this.nota2  = n2; 
            this.nota3  = n3; 
        } 

        
        Estudiante.prototype.promedio = function() { 
            // toFixed(2) retorna String 
            return ((this.nota1 + this.nota2 + this.nota3) / 3).toFixed(2); 
        }; 

        Estudiante.prototype.estado = function() { 
            // Se usa parseFloat para comparar correctamente 
            return parseFloat(this.promedio()) >= 51 ? 'Aprobado' : 'Reprobado'; 
        }; 
    </script>
</head>
<body>

    <h2>Ejercicio 3: Arrays y Objetos (Gestión de Estudiantes)</h2>

    <div id="tabla"></div>
    <p id="resumen"></p>
    <p id="nombres"></p>

    <script>
        // Instanciar 5 estudiantes
        var estudiantes = [ 
            new Estudiante('Ana Lopez',  75, 82, 90), 
            new Estudiante('Luis Rios',  40, 55, 48), 
            new Estudiante('Maria Paz',  88, 92, 85), 
            new Estudiante('Juan Abad',  60, 70, 65), 
            new Estudiante('Sofia Cruz', 30, 45, 50) 
        ]; 

        // Filter: Contar aprobados (Instrucción 4.5.4) [cite: 662, 699]
        var aprobados = estudiantes.filter(function(e) { 
            return parseFloat(e.promedio()) >= 51; 
        }); 
        
        var nAprobados = aprobados.length;
        var nReprobados = estudiantes.length - nAprobados;

        document.getElementById('resumen').innerHTML = 
            '<span class="aprobado-texto">Aprobados: ' + nAprobados + ' de ' + estudiantes.length + '</span><br>' +
            '<span class="reprobado-texto">Reprobados: ' + nReprobados + ' de ' + estudiantes.length + '</span>'; 

        //  Map: Extraer solo nombres 
        var listaNombres = estudiantes.map(function(e) { return e.nombre; }); 
        document.getElementById('nombres').textContent = 'Nombres (map): ' + listaNombres.join(', '); 

        //  Construir tabla HTML 
        var html = '<table>' +
                   '<tr><th>Nombre</th><th>Nota 1</th><th>Nota 2</th><th>Nota 3</th><th>Promedio</th><th>Estado</th></tr>'; 

        estudiantes.forEach(function(e) { 
            
            var bg = e.estado() === 'Aprobado' ? '#D1FAE5' : '#FEE2E2'; 
            
            html += '<tr style="background:' + bg + '">' 
                  + '<td>' + e.nombre + '</td>' 
                  + '<td>' + e.nota1 + '</td>' 
                  + '<td>' + e.nota2 + '</td>' 
                  + '<td>' + e.nota3 + '</td>' 
                  + '<td>' + e.promedio() + '</td>' 
                  + '<td>' + e.estado() + '</td>' 
                  + '</tr>'; 
        }); 
        html += '</table>'; 
        document.getElementById('tabla').innerHTML = html; 

        
        console.log("JSON de un estudiante:", JSON.stringify(estudiantes[0])); 
    </script>
</body>
</html>
