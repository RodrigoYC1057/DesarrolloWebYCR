<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1</title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        h1 {
            color: #1e40af; 
        }
        ul {
            list-style-type: disc; 
            margin-bottom: 20px;
        }
        table {
            border-collapse: collapse; 
            width: 250px;
        }
        table, td {
            border: 1px solid black; 
        }
        td {
            padding: 10px;
            text-align: center;
        }
        .titulo-tabla {
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 5px;
        }
    </style>
    <script>
        function clasificar(e){
            if(e < 18) return "Menor de edad";
            else if(e < 30) return "Joven";
            else if(e < 60) return "Adulto";
            else return "Senior";
        }

        function parImpar(num){
            return (num % 2 == 0) ? "Par" : "Impar";
        }

        function factorial(x){
            var f = 1;
            for(var j = 2; j <= x; j++){
                f = f * j;
            }
            return f;
        }
    </script>
</head>
<body>

    <h1>Ejercicio 1</h1>

    <script>
        // PEDIR DATOS AL USUARIO
        var nombre = prompt("Ingresa tu nombre:");
        var edad = parseInt(prompt("Ingresa tu edad:"));
        var n = parseInt(prompt("Ingresa un número para la tabla:"));

        // MOSTRAR DATOS 
        document.write("<ul>");
        document.write("<li><b>Nombre:</b> " + nombre + "</li>");
        document.write("<li><b>Clasificación de edad:</b> " + clasificar(edad) + "</li>");
        document.write("<li><b>Factorial de " + n + ":</b> " + factorial(n) + "</li>");
        document.write("<li><b>El número " + n + " es:</b> " + parImpar(n) + "</li>");
        document.write("</ul>");

        // MOSTRAR TITULO DE LA TABLA
        document.write("<div class='titulo-tabla'>Tabla del " + n + "</div>");

        // CREAR TABLA
        document.write("<table>");
        for(var i = 1; i <= 10; i++){
            document.write(
                "<tr>" +
                "<td>" + n + " x " + i + "</td>" +
                "<td>" + (n * i) + "</td>" +
                "</tr>"
            );
        }
        document.write("</table>");

        // ALERT 
        alert("Hola " + nombre +
            "\nClasificación: " + clasificar(edad) +
            "\nEl número es: " + parImpar(n) +
            "\nFactorial de " + n + " = " + factorial(n)
        );
    </script>

</body>
</html>
