<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro Estudiantil</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
        .contenedor-formularios { display: flex; gap: 20px; }
        .formulario { border: 2px solid #007BFF; padding: 20px; border-radius: 8px; flex: 1; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input[type="text"], input[type="email"], input[type="number"], select, textarea {
            width: 100%; padding: 8px; box-sizing: border-box;
        }
        button { background-color: #007BFF; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h2>Laboratorio 2 - Registro Estudiantil</h2>
    <div class="contenedor-formularios">

        <div class="formulario">
            <h3>Enviar por GET</h3>
            <form action="procesar.php" method="GET">
                <div class="form-group">
                    <label>Nombre completo:</label>
                    <input type="text" name="nombre" required>
                </div>
                <div class="form-group">
                    <label>Correo electrónico:</label>
                    <input type="email" name="correo" required>
                </div>
                <div class="form-group">
                    <label>Carrera:</label>
                    <select name="carrera">
                        <option value="Ingeniería en Ciencias de la Computación">Ingeniería en Ciencias de la Computación</option>
                        <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
                        <option value="Ingeniería en Redes">Ingeniería en Redes y Telecomunicaciones</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Semestre actual (1-10):</label>
                    <input type="number" name="semestre" min="1" max="10" required>
                </div>
                <div class="form-group">
                    <label>Turno:</label>
                    <input type="radio" name="turno" value="Mañana" required> Mañana
                    <input type="radio" name="turno" value="Tarde" required> Tarde
                    <input type="radio" name="turno" value="Noche" required> Noche
                </div>
                <div class="form-group">
                    <label>Materias de interés:</label>
                    <input type="checkbox" name="materias[]" value="Desarrollo Web"> Desarrollo Web<br>
                    <input type="checkbox" name="materias[]" value="Bases de Datos"> Bases de Datos<br>
                    <input type="checkbox" name="materias[]" value="Inteligencia Artificial"> Inteligencia Artificial
                </div>
                <div class="form-group">
                    <label>Comentarios:</label>
                    <textarea name="comentarios" rows="3"></textarea>
                </div>
                <button type="submit">Enviar datos (GET)</button>
            </form>
        </div>

        <div class="formulario" style="border-color: #28a745;">
            <h3 style="color: #28a745;">Enviar por POST</h3>
            <form action="procesar.php" method="POST">
                <div class="form-group">
                    <label>Nombre completo:</label>
                    <input type="text" name="nombre" required>
                </div>
                <div class="form-group">
                    <label>Correo electrónico:</label>
                    <input type="email" name="correo" required>
                </div>
                <div class="form-group">
                    <label>Carrera:</label>
                    <select name="carrera">
                        <option value="Ingeniería en Ciencias de la Computación">Ingeniería en Ciencias de la Computación</option>
                        <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
                        <option value="Ingeniería en Redes">Ingeniería en Redes y Telecomunicaciones</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Semestre actual (1-10):</label>
                    <input type="number" name="semestre" min="1" max="10" required>
                </div>
                <div class="form-group">
                    <label>Turno:</label>
                    <input type="radio" name="turno" value="Mañana" required> Mañana
                    <input type="radio" name="turno" value="Tarde" required> Tarde
                    <input type="radio" name="turno" value="Noche" required> Noche
                </div>
                <div class="form-group">
                    <label>Materias de interés:</label>
                    <input type="checkbox" name="materias[]" value="Desarrollo Web"> Desarrollo Web<br>
                    <input type="checkbox" name="materias[]" value="Bases de Datos"> Bases de Datos<br>
                    <input type="checkbox" name="materias[]" value="Inteligencia Artificial"> Inteligencia Artificial
                </div>
                <div class="form-group">
                    <label>Comentarios:</label>
                    <textarea name="comentarios" rows="3"></textarea>
                </div>
                <button type="submit" style="background-color: #28a745;">Enviar datos (POST)</button>
            </form>
        </div>

    </div>

</body>
</html>
