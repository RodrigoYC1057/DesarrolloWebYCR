<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pregunta 2 - Cadenas</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f4f7; margin: 0; padding: 25px; }
        .caja { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 8px; }
        h1 { color: #2c3e50; }
        label { display: block; margin-top: 15px; }
        input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 6px; }
        button { margin-top: 18px; padding: 10px 18px; color: white; background: #2c3e50; border: 0; cursor: pointer; }
        a { color: #2c3e50; }
    </style>
</head>
<body>
    <div class="caja">
        <h1>Procesamiento de cadenas</h1>
        <form method="GET" action="procesar.php">
            <label for="cadena">Cadena de texto:</label>
            <input type="text" id="cadena" name="cadena" required>

            <label for="n">Cantidad de guiones entre letras:</label>
            <input type="number" id="n" name="n" min="0" max="20" value="3" required>

            <button type="submit">Procesar</button>
        </form>
        <p><a href="../index.html">Volver al menú principal</a></p>
    </div>
</body>
</html>
