<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo libro</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f4f7; margin: 0; padding: 25px; }
        .contenedor { max-width: 550px; margin: auto; background: white; padding: 25px; border-radius: 8px; }
        h1 { color: #2c3e50; }
        label { display: block; margin-top: 13px; }
        input { box-sizing: border-box; width: 100%; padding: 10px; margin-top: 5px; }
        button { margin-top: 18px; padding: 10px 16px; background: #2c3e50; color: white; border: 0; cursor: pointer; }
        a { color: #2c3e50; }
    </style>
</head>
<body>
<div class="contenedor">
    <h1>Registrar nuevo libro</h1>
    <form method="POST" action="insertar.php">
        <label for="titulo">Título:</label>
        <input type="text" id="titulo" name="titulo" maxlength="150" required>

        <label for="autor">Autor:</label>
        <input type="text" id="autor" name="autor" maxlength="100" required>

        <label for="anio">Año:</label>
        <input type="number" id="anio" name="anio" min="0" max="2100" required>

        <label for="editorial">Editorial:</label>
        <input type="text" id="editorial" name="editorial" maxlength="100" required>

        <button type="submit">Guardar libro</button>
    </form>
    <p><a href="listar.php">Volver al listado</a></p>
</div>
</body>
</html>
