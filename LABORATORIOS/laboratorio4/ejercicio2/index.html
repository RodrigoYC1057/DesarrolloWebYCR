<!DOCTYPE html>
<!-- Integrantes: Rodrigo Yucra Caballero y Luis Hernan Huallpa Franses -->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería USFX - Panel de administración</title>
    <link rel="stylesheet" href="../estilos.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header class="cabecera">
        <div>
            <h1>Cafetería USFX</h1>
            <p>Administración del menú · Ejercicio 2 (AJAX con Fetch API)</p>
        </div>
        <nav>
            <button type="button" data-vista="inicio">Inicio</button>
            <button type="button" data-vista="menu">Menú</button>
            <button type="button" data-vista="nuevo">Nuevo producto</button>
        </nav>
    </header>

    <div class="contenedor">
        <!-- Avisos de exito o error (se llenan con JavaScript) -->
        <div id="aviso"></div>

        <!-- Aqui se cargan las vistas: nunca se recarga la pagina -->
        <main class="panel" id="contenido"></main>
    </div>

    <!-- Ventana modal reutilizada para el detalle y la confirmacion -->
    <div class="modal" id="modal">
        <div class="modal-caja">
            <div class="modal-titulo" id="modalTitulo"></div>
            <div class="modal-cuerpo" id="modalCuerpo"></div>
            <div class="modal-pie" id="modalPie"></div>
        </div>
    </div>

    <footer class="pie">SIS-256 · Tecnología y Desarrollo Web · Laboratorio 4</footer>
</body>
</html>
